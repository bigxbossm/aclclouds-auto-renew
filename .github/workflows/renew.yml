name: ACLClouds Auto Renew

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: auth.json
          key: acl-session-${{ github.run_id }}
          restore-keys: |
            acl-session-

      - name: Install
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Renew
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
          ACL_BASE_URL: ${{ vars.ACL_BASE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node renew.mjs
