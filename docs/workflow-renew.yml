name: ACLClouds Auto Renew

on:
  schedule:
    # 每 4 小时检查一次(Free 套餐到期前 1 天开放续期,高频轮询保证第一时间续上)
    - cron: '17 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aclclouds-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Renew
        id: renew
        continue-on-error: true
        env:
          ACL_SESSION: ${{ secrets.ACL_SESSION }}
          ACL_REMEMBER: ${{ secrets.ACL_REMEMBER }}
          ACL_EMAIL: ${{ secrets.ACL_EMAIL }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_SERVER_ID: ${{ secrets.ACL_SERVER_ID }}
        run: node renew.mjs | tee renew.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ACLClouds 续期结果"
            echo '```'
            cat renew.log 2>/dev/null || echo "(无输出)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
